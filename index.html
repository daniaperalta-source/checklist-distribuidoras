:root{
  --bg:#070708;
  --surface:#121215;
  --surface-2:#1a1a1f;
  --surface-3:#22222a;
  --line:#2a2a31;
  --line-strong:#3a3a44;
  --text:#f3f3f5;
  --muted:#9d9daa;
  --faint:#6b6b78;
  --red:#c8102e;
  --red-hi:#e11d3a;
  --red-deep:#4a000d;
  --red-tint:#2a0a10;
  --navy:#1e3a6b;
  --navy-hi:#8fb0e8;
  --ok:#2fb38a;
  --ok-tint:#0f2a22;
  --bad:#f0445a;
  --bad-tint:#2e0c13;
  --warn:#f2a516;
  --warn-tint:#2c210a;
  --ok-text:#6fe0b9;
  --ok-border:#1f5e4b;
  --warn-text:#ffc95c;
  --bad-text:#ff8a98;
  --bad-label:#ffb3bd;
  --nc-bg:#150a0d;
  --nc-border:#7a1e2c;
  --ncp-border:#5a1824;
  --chip-border:#6a2230;
  --chip-text:#ffd0d6;
  --chip-on-bg:#ffffff;
  --chip-on-text:#2a0710;
  --ci-border:#5a1220;
  --ci-text:#ff8496;
  --strip-bg:#070708f2;
  --back-bg:#ffffff;
  --back-text:#0b0b0d;
  --back-hover:#ececef;
  --input-bg:#070708;
  --toast-bg:#ffffff;
  --toast-text:#0b0b0d;
  --code-stroke:#ffffff14;
  --radius:6px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-move:cubic-bezier(0.77,0,0.175,1);
  --gutter:47px;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:2px solid var(--bg)}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a.dcard,a.lcard-main,a.back,a.btn,a.icon-btn{text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Encabezado ---------- */
.top{color:#fff;background:linear-gradient(90deg,#120005 0%,#2a0008 38%,#6e0014 72%,#b0001e 100%);border-bottom:1px solid #000}
.top-in{max-width:1270px;margin:0 auto;padding:20px var(--gutter);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:15px;min-width:0;flex:1;text-decoration:none;color:inherit}
.mark{width:52px;height:52px;flex-shrink:0;display:block;border-radius:3px;box-shadow:0 0 0 1px #ffffff26}
.brand h1{margin:0;font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.2px}
.brand p{margin:3px 0 0;color:#e6c9cf;font-size:14px}
.top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:8px;height:37px;padding:0 14px;border-radius:999px;border:1px solid #ffffff2e;background:#00000040;color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.pill .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0}
.pill.on .dot{background:var(--ok);border-color:var(--ok)}
.pill.checking .dot{border-color:var(--warn);border-top-color:transparent;animation:spin .8s linear infinite}
.pill .q{background:var(--warn);color:#1a1200;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}
.lockbtn{display:inline-flex;align-items:center;gap:8px;height:37px;padding:0 13px;border-radius:999px;border:1px solid #ffffff2e;background:#00000040;color:#fff;font-size:14px;font-weight:500;transition:transform 160ms ease-out,background-color 160ms ease}
.lockbtn svg{width:16px;height:16px;flex-shrink:0}
.lockbtn.unlocked{background:#fff;color:#14000a;border-color:#fff}
.lockbtn:active,.btn:active,.opt:active,.dcard:active,.lcard-main:active,.icon-btn:active{transform:scale(.97)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Banda de edición ---------- */
.editband{background:var(--navy);color:#fff}
.editband-in{max-width:1270px;margin:0 auto;padding:10px var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.editband p{margin:0;flex:1;min-width:200px;font-size:14.5px}
.editband strong{font-weight:700}
.editband .btn.light{background:#fff;color:#0b0b0d}

/* ---------- Contenido ---------- */
main{max-width:1270px;margin:0 auto;padding:16px var(--gutter) 64px}
.crumbs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:48px}
.back{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 19px 0 15px;background:var(--back-bg);color:var(--back-text);border:0;border-radius:var(--radius);font-weight:700;font-size:16px;transition:transform 160ms ease-out}
.back svg{width:16px;height:16px}
.trail{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.trail a{color:var(--muted);text-decoration:none}
.trail a:hover{color:var(--text)}
.trail b{color:var(--text);font-weight:700;overflow-wrap:anywhere}
.trail .sep{color:var(--faint)}

.ptitle{margin:30px 0 0;display:flex;align-items:center;gap:16px}
.ptitle h2{margin:0;font-family:var(--cond);font-weight:700;font-size:46px;line-height:1;overflow-wrap:anywhere}

.badge-ico{width:52px;height:52px;flex-shrink:0;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.badge-ico svg{width:28px;height:28px;color:var(--red-hi)}
.psub{margin:10px 0 0;color:var(--muted);font-size:17px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:26px}

/* Tarjeta de distribuidora */
.dcard{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 23px 22px;min-height:124px;color:inherit;transition:transform 160ms ease-out,border-color 160ms ease,background-color 160ms ease;display:block;width:100%}
.dcard .code{position:absolute;right:16px;bottom:-14px;font-family:var(--cond);font-weight:800;font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--code-stroke);pointer-events:none;white-space:nowrap}
.dcard h3{position:relative;margin:0;font-family:var(--cond);font-weight:800;font-size:clamp(34px,3.3vw,44px);line-height:1;text-transform:uppercase;letter-spacing:.2px;overflow-wrap:break-word;padding-right:4px}
.dcard .place{position:relative;margin:6px 0 0;color:var(--muted);font-size:14.5px}
.dcard .meta{position:relative;margin:12px 0 0;color:var(--muted);font-size:15px}
.dcard .meta b{color:var(--text);font-weight:700}
.dcard.empty h3{color:#c9c9d1}
.dcard .tag{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
@media (hover:hover) and (pointer:fine){
  .dcard:hover,.lcard:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .back:hover{background:var(--back-hover)}
  .btn.primary:hover{background:var(--red-hi)}
  .btn.ghost:hover{background:var(--surface-3)}
  .opt:hover{border-color:var(--line-strong)}
  .lockbtn:not(.unlocked):hover{background:#00000070}
  .icon-btn:hover{background:var(--surface-3);color:var(--text)}
}

/* Estados de la semana */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.st svg{width:13px;height:13px}
.st.done{background:var(--ok-tint);color:var(--ok-text)}
.st.pend{background:var(--warn-tint);color:var(--warn-text)}
.st.none{background:var(--surface-3);color:var(--muted)}

/* Tarjeta de línea */
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;transition:border-color 160ms ease,background-color 160ms ease;min-width:0}
.lcard-main{display:block;text-align:left;background:none;border:0;color:inherit;padding:22px 22px 18px;width:100%;transition:transform 160ms ease-out;min-width:0}
.lcard h3{margin:0;font-family:var(--cond);font-weight:800;font-size:36px;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lcard .eq{margin:6px 0 0;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.lcard .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.lcard .row span.n{color:var(--muted);font-size:15px}
.lcard .row span.n b{color:var(--text)}
.lcard-tools{display:flex;gap:6px;border-top:1px solid var(--line);padding:8px 10px;flex-wrap:wrap}
.icon-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 11px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;transition:transform 160ms ease-out,background-color 160ms ease,color 160ms ease}
.icon-btn svg{width:16px;height:16px;flex-shrink:0}
.icon-btn.danger{color:var(--bad-text)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.addcard{border:1.5px dashed var(--line-strong);background:transparent;border-radius:var(--radius);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:600;font-size:16px;transition:transform 160ms ease-out,border-color 160ms ease,color 160ms ease}
.addcard svg{width:26px;height:26px}
.dwrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.dwrap .dcard{flex:1}
.dtools{display:flex;gap:6px;flex-wrap:wrap}
@media (hover:hover) and (pointer:fine){.addcard:hover{border-color:var(--red-hi);color:var(--text)}}

.emptybox{margin-top:26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:34px 26px;max-width:620px}
.emptybox h3{margin:0 0 6px;font-family:var(--cond);font-size:28px;font-weight:700}
.emptybox p{margin:0;color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--radius);border:1px solid transparent;font-weight:700;font-size:16px;transition:transform 160ms ease-out,background-color 160ms ease,opacity 160ms ease;white-space:nowrap}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:var(--surface-2);border-color:var(--line-strong);color:var(--text)}
.btn.light{background:var(--back-bg);color:var(--back-text)}
.btn.sm{height:38px;padding:0 14px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Checklist ---------- */
.lhead{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.lhead h2{margin:0;font-family:var(--cond);font-weight:800;font-size:46px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.lhead .eq{margin:8px 0 0;color:var(--muted);font-size:17px;overflow-wrap:anywhere}
.fields{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea,.input{width:100%;height:46px;background:var(--input-bg);border:1px solid var(--line-strong);border-radius:5px;padding:0 12px;font-size:16px;transition:border-color 160ms ease}
.field textarea,.input.ta{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none;border-color:var(--red-hi)}
.field .fixed{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:15px}
.field .fixed svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.field.need input{border-color:var(--bad)}

/* Tira de avance: un segmento por actividad */
.strip{position:sticky;top:0;z-index:20;margin:20px calc(var(--gutter) * -1) 0;padding:12px var(--gutter);background:var(--strip-bg);border-bottom:1px solid var(--line);backdrop-filter:none}
.strip-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.strip-row .c{font-size:15px;color:var(--muted)}
.strip-row .c b{color:var(--text);font-family:var(--cond);font-size:20px;font-weight:700}
.strip-row .k{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.strip-row .k span{display:inline-flex;align-items:center;gap:6px}
.strip-row .k i{width:10px;height:10px;border-radius:2px;display:inline-block}
.segs{display:flex;gap:3px;height:12px}
.seg{flex:1;min-width:3px;border:0;padding:0;border-radius:2px;background:var(--surface-3);transition:background-color 200ms ease}
.seg.ok{background:var(--ok)}
.seg.nc{background:var(--bad)}
.seg.gap{margin-left:7px}

.cat{margin-top:30px}
.cat-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cat-h .ci{width:38px;height:38px;flex-shrink:0;border-radius:5px;background:var(--red-tint);border:1px solid var(--ci-border);display:grid;place-items:center;color:var(--ci-text)}
.cat-h .ci svg{width:20px;height:20px}
.cat-h h3{margin:0;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1;flex:1;min-width:0}
.cat-h .cc{color:var(--muted);font-size:14.5px;white-space:nowrap}
.cat-note{margin:-4px 0 12px 50px;color:var(--warn-text);font-size:14px;display:flex;gap:7px;align-items:flex-start}
.cat-note svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}

.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;transition:border-color 200ms ease,background-color 200ms ease;scroll-margin-top:96px}
.act.ok{border-color:var(--ok-border)}
.act.nc{border-color:var(--nc-border);background:var(--nc-bg)}
.act.need{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.act .n{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--faint);line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.act .t{margin:0;font-weight:600;font-size:16.5px;line-height:1.35;overflow-wrap:anywhere}
.act .cr{margin:4px 0 0;color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.opts{display:flex;gap:8px}
.opt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:48px;min-width:118px;padding:0 14px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);font-weight:700;font-size:15px;transition:transform 160ms ease-out,background-color 160ms ease,border-color 160ms ease,color 160ms ease;white-space:nowrap}
.opt svg{width:17px;height:17px;flex-shrink:0}
.opt.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#03140e}
.opt.nc[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.ncp{grid-column:2 / 4;background:var(--bad-tint);border:1px solid var(--ncp-border);border-radius:5px;padding:14px;margin-top:6px;animation:reveal 220ms var(--ease-out)}
.ncp .lbl{display:block;font-size:13.5px;font-weight:700;color:var(--bad-label);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--chip-border);background:transparent;color:var(--chip-text);font-size:14px;font-weight:600;transition:background-color 160ms ease,color 160ms ease,transform 160ms ease-out}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}
.ncp textarea{width:100%;min-height:80px;background:var(--input-bg);border:1px solid var(--chip-border);border-radius:5px;padding:10px 12px;font-size:16px;resize:vertical;line-height:1.4}
.ncp textarea:focus{outline:none;border-color:var(--chip-on-bg)}
.ncp .hint{margin:6px 0 0;font-size:13px;color:var(--bad-label)}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.submitbar{margin-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.submitbar p{margin:0;flex:1;min-width:220px;color:var(--muted);font-size:15px}
.submitbar p b{color:var(--text)}

/* Pantalla de enviado */
.done{margin-top:30px;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;animation:reveal 300ms var(--ease-out)}
.done .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px}
.done .ico svg{width:30px;height:30px}
.done .ico.ok{background:var(--ok-tint);color:var(--ok-text)}
.done .ico.q{background:var(--warn-tint);color:var(--warn-text)}
.done h2{margin:0;font-family:var(--cond);font-size:38px;font-weight:700;line-height:1.05}
.done p{margin:10px 0 0;color:var(--muted)}
.done ul{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.done li{display:flex;gap:10px;background:var(--bad-tint);border:1px solid var(--ncp-border);border-radius:5px;padding:10px 12px;font-size:15px}
.done li b{color:var(--bad-label);flex-shrink:0}
.done .acts-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.sum{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.sum div{font-size:14px;color:var(--muted)}
.sum b{display:block;font-family:var(--cond);font-size:34px;line-height:1;color:var(--text);font-weight:700}

/* ---------- Editor de actividades ---------- */
.ed-cat{margin-top:28px}
.ed-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.ed-row .n{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--faint);text-align:right;padding-top:8px;font-variant-numeric:tabular-nums}
.ed-row .inputs{display:grid;gap:8px;min-width:0}
.ed-row .inputs .input{height:42px}
.ed-row .inputs .input.ta{min-height:60px}
.ed-row .tools{display:flex;flex-direction:column;gap:4px}
.ed-row .tools .icon-btn{padding:0 9px;justify-content:flex-start}
.ed-add{margin-top:4px}
.ed-gh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ed-gh .ci{width:38px;height:38px;flex-shrink:0;border-radius:5px;background:var(--red-tint);border:1px solid var(--ci-border);display:grid;place-items:center;color:var(--ci-text)}
.ed-gh .ci svg{width:20px;height:20px}
.ed-gname{flex:1;min-width:0;height:46px;font-family:var(--cond);font-weight:700;font-size:24px!important;padding:0 12px}
.ed-gh .cc{color:var(--muted);font-size:14.5px;white-space:nowrap}
.ed-gopts{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:10px;align-items:end;margin:0 0 12px 50px}
.ed-gopts .input{height:40px}
.ed-gf{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.ed-gtools{display:flex;gap:4px;flex-wrap:wrap}
.ed-addg{width:100%;min-height:90px;margin-top:28px}
.imp-list{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:5px;max-height:220px;overflow:auto}
.imp-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.imp-list li:last-child{border-bottom:0}
.lab-s{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.radio{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--red)}

/* ---------- Diálogo ---------- */
dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 24px 60px -12px #000c}
dialog::backdrop{background:#000000b3}
dialog[open]{animation:dlg 220ms var(--ease-out)}
@keyframes dlg{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.dlg-in{padding:24px}
.dlg-in h3{margin:0 0 6px;font-family:var(--cond);font-size:28px;font-weight:700}
.dlg-in > p{margin:0 0 16px;color:var(--muted);font-size:15px}
.dlg-in .field{margin-bottom:14px}
.dlg-act{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.pinbox{letter-spacing:8px;text-align:center;font-family:var(--cond);font-size:26px!important;font-weight:700}
.err{color:var(--bad-text);font-size:14px;margin:8px 0 0;min-height:20px}

/* ---------- Aviso ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--toast-bg);color:var(--toast-text);padding:12px 18px;border-radius:6px;font-weight:600;font-size:15px;box-shadow:0 12px 30px -8px #000c;z-index:100;max-width:calc(100vw - 32px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}

.view{animation:viewin 240ms var(--ease-out)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Checklist en formato orden de trabajo ---------- */
.ot{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:var(--radius);overflow:hidden}
.ot-resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--red-tint);border-bottom:1px solid var(--line)}
.ot-resume p{margin:0;flex:1;min-width:220px;font-size:14.5px;color:var(--bad-label)}
.ot-resume p b{color:var(--bad-label)}
.ot-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.ot-kick{margin:0 0 4px;color:var(--ci-text);font-size:13.5px;font-weight:600}
.ot-title h2{margin:0;font-family:var(--cond);font-weight:800;font-size:44px;line-height:1;overflow-wrap:anywhere}
.ot-sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.ot-headr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ot-headr p{margin:0;color:var(--muted);font-size:13.5px;max-width:420px}
.ot-headr p b{color:var(--text)}
.ot-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}
.ot-f{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);min-width:0}
.ot-f:nth-last-child(-n+2){border-bottom:0}
.ot-f:nth-child(odd){border-right:1px solid var(--line)}
.ot-f label,.ot-f .lab{font-size:14px;font-weight:600;color:var(--text)}
.ot-f i,.lbl i{color:var(--red);font-style:normal}
.ot-f b{font-size:15px}
.ot-f.need .ot-in,.ot-f.need .ot-seg button{border-color:var(--bad)}
.ot-in{width:100%;height:42px;background:var(--input-bg);border:1px solid var(--line-strong);border-radius:5px;padding:0 12px;font-size:15.5px;transition:border-color 160ms ease;min-width:0}
.ot-in.ta{height:auto;min-height:72px;padding:9px 12px;resize:vertical;line-height:1.4}
.ot-in:focus{outline:none;border-color:var(--red)}
.ot-seg{display:flex;gap:6px;flex-wrap:wrap}
.ot-seg button{height:42px;min-width:44px;padding:0 14px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:15px;transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease,transform 160ms ease-out}
.ot-seg button[aria-pressed="true"]{background:var(--back-bg);color:var(--back-text);border-color:var(--back-bg)}
.ot-route{padding:14px 20px;border-bottom:1px solid var(--line)}
.ot-route .lab{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.ot-steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ot-step{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:border-color 160ms ease,background-color 160ms ease,transform 160ms ease-out}
.ot-step .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:13px;font-weight:700;transition:background-color 200ms ease,color 200ms ease}
.ot-step.is-ok{border-color:var(--ok-border)}
.ot-step.is-ok .k{background:var(--ok);color:#fff}
.ot-step.is-bad{border-color:var(--nc-border)}
.ot-step.is-bad .k{background:var(--bad);color:#fff}
.ot-th{display:grid;grid-template-columns:70px minmax(0,1fr) 250px 220px;gap:14px;padding:11px 20px;background:#10131c;color:#fff;font-size:13.5px;font-weight:700}
.ot-grp-h{display:flex;align-items:center;gap:10px;padding:11px 20px;background:var(--red-tint);border-bottom:1px solid var(--ci-border);scroll-margin-top:12px}
.ot-grp-h .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#7a0015;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.ot-grp-h h3{margin:0;flex:1;min-width:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
.ot-grp-h .cc{font-size:14px;color:var(--muted);font-weight:600}
.ncb{background:var(--bad);color:#fff;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ot-warn{margin:0;padding:8px 20px;display:flex;gap:7px;align-items:center;font-size:14px;color:var(--warn-text);background:var(--warn-tint);border-bottom:1px solid var(--line)}
.ot-warn svg{width:16px;height:16px;flex-shrink:0}
.ot-row{display:grid;grid-template-columns:70px minmax(0,1fr) 250px 220px;gap:10px 14px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);transition:background-color 200ms ease;scroll-margin-top:12px}
.ot-row.nc{background:var(--nc-bg)}
.ot-row.need{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-tint)}
.ot-num{color:var(--muted);font-size:14px}
.ot-act .t{margin:0;font-weight:600;font-size:15.5px;line-height:1.35;color:#7a1020;overflow-wrap:anywhere}
.ot-act .cr{margin:3px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.ot-ver{display:flex;gap:8px}
.vbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 10px;border-radius:5px;background:var(--surface);font-weight:700;font-size:14.5px;white-space:nowrap;transition:background-color 160ms ease,color 160ms ease,transform 160ms ease-out}
.vbtn svg{width:16px;height:16px;flex-shrink:0}
.vbtn.ok{border:1.5px solid var(--ok);color:var(--ok-text)}
.vbtn.nc{border:1.5px solid var(--bad);color:var(--bad-text)}
.vbtn.ok[aria-pressed="true"]{background:var(--ok);color:#03140e}
.vbtn.nc[aria-pressed="true"]{background:var(--bad);color:#fff}
.vbtn:active,.ot-step:active,.ot-seg button:active,.ot-chip:active{transform:scale(.97)}
.ot-nc{grid-column:1 / -1;margin:4px 0 2px;background:var(--surface);border:1px solid var(--nc-border);border-radius:5px;padding:16px;animation:reveal 220ms var(--ease-out)}
.ot-nc-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ot-nc-h h4{margin:0;font-size:15.5px;font-weight:700;color:var(--bad-label);min-width:0;overflow-wrap:anywhere}
.ot-nc-h .meta{margin:0;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.ot-nc-h .meta b{color:var(--text)}
.ot-nc-h .meta b.open{color:var(--bad-text)}
.ot-nc .lbl{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px;color:var(--text)}
.ot-nc .lbl:first-of-type{margin-top:0}
.ot-chips{display:flex;flex-wrap:wrap;gap:6px}
.ot-chip{height:36px;padding:0 12px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600;transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease,transform 160ms ease-out}
.ot-chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.ot-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.ot-2 .ot-seg button{height:40px}
.ot-note{margin:14px 0 0;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:5px;color:var(--muted);font-size:13px}
.ot-spacer{height:96px}
.ot-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -12px #10131c40}
.ot-bar-in{max-width:1270px;margin:0 auto;padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.ot-prog{flex:1;min-width:0}
.ot-prog p{margin:0 0 7px;font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.ot-prog p b{color:var(--text)}
.ot-prog .okc{color:var(--ok-text);font-weight:600}
.ot-prog .ncc{color:var(--bad-text);font-weight:600}
.ot-track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.ot-track i{display:block;height:100%;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease-move)}
@media (hover:hover) and (pointer:fine){
  .ot-step:hover,.ot-chip:not([aria-pressed="true"]):hover,.ot-seg button:not([aria-pressed="true"]):hover{border-color:var(--text)}
  .vbtn.ok:not([aria-pressed="true"]):hover{background:var(--ok-tint)}
  .vbtn.nc:not([aria-pressed="true"]):hover{background:var(--bad-tint)}
}
@media (max-width:900px){
  .ot-th{display:none}
  .ot-row{grid-template-columns:44px minmax(0,1fr);align-items:start}
  .ot-ver,.ot-obs{grid-column:1 / -1}
  .ot-num{padding-top:2px}
}
@media (max-width:760px){
  .ot-head{grid-template-columns:minmax(0,1fr);padding:18px 14px 14px}
  .ot-headr{text-align:left;align-items:flex-start}
  .ot-title h2{font-size:36px}
  .ot-form{grid-template-columns:minmax(0,1fr)}
  .ot-f{grid-template-columns:minmax(0,1fr);gap:6px;padding:11px 14px}
  .ot-f:nth-child(odd){border-right:0}

const API_URL = 'https://script.google.com/macros/s/AKfycbxIMpn7F_s8znc54wRKmAAZ5lDFRPKQ3aYs1fBRbR3cD6W3Wf0Ihr4RdaXAIzMv_hw5/exec';

/* ---------- Actividades base de la dobladora (referencia: prensa plegadora hidráulica tipo Harsle) ---------- */
const ACT_DOBLADORA = [

  ['lim','Limpiar la máquina por fuera','Quitar polvo, grasa y aceite con un trapo.'],

  ['lim','Dejar limpia y ordenada el área alrededor','Sin retazos de lámina ni derrames en el piso.'],
  ['lub','Engrasar los rodos del tope trasero','Poner la grasa indicada, sin exceso.'],
  ['lub','Quitar el exceso de grasa y revisar las graseras','Ninguna grasera rota, tapada o faltante.'],

  ['fug','Piso debajo de la máquina sin manchas de aceite','Si hay una mancha nueva, buscar de dónde viene.']
].map((a,i)=>({id:'dz3-'+String(i+1).padStart(2,'0'), cat:a[0], texto:a[1], criterio:a[2]}));

function defaultConfig(){
  const D = (id,nombre,codigo,lugar,lineas=[]) => ({id,nombre,codigo,lugar,lineas});
  return {
    version:2, updatedAt:null, pinHash:DEFAULT_PIN_HASH,
    distribuidoras:[

        {id:'dobladora', nombre:'Dobladora', equipo:'Dobladora hidráulica', actividades:ACT_DOBLADORA.map(a=>({...a}))}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, a, b) => `${n.toLocaleString('es-GT')} ${n === 1 ? a : b}`;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function hashPin(str, seed = 7){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'linea'; }
function lsGet(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function hoyISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

/* Grupos de actividades de cada línea (se pueden renombrar, agregar, mover y borrar) */
function grupos(l){
  if (!Array.isArray(l.grupos) || !l.grupos.length) l.grupos = DEFAULT_GRUPOS();
  l.actividades.forEach(a => { if (!l.grupos.some(g => g.id === a.cat)) l.grupos.push({id:a.cat, nombre:'Otras actividades', falla:'Mecánico', nota:''}); });
  return l.grupos;
}
const grupoDe = (l, a) => grupos(l).find(g => g.id === a.cat) || grupos(l)[0];

/* ---------- Conexión y Apps Script ---------- */
function paintConn(){
  const p = $('#conn');
  p.className = 'pill' + (conn === 'on' ? ' on' : conn === 'checking' ? ' checking' : '');
  $('#connTxt').textContent = conn === 'on' ? 'Conectado' : conn === 'checking' ? 'Conectando' : 'Sin conexión';
  const q = $('#connQ');
  q.hidden = !queue.length; q.textContent = queue.length;
  p.title = !API_URL ? 'Falta pegar la URL de Apps Script en el archivo. Los envíos se guardan en este teléfono.'
    : queue.length ? plural(queue.length,'envío pendiente','envíos pendientes') + ' de mandar a la hoja.' : '';
}
async function apiGet(params){
  const u = API_URL + '?' + new URLSearchParams(params);
  const r = await fetch(u, {method:'GET', cache:'no-store'});
  return r.json();
}
async function apiPost(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
async function loadRemote(){
  if (!API_URL){ conn = 'off'; paintConn(); return; }
  conn = 'checking'; paintConn();
  try{
    const res = await apiGet({action:'config'});
    if (!res || !res.ok) throw new Error(res && res.error);
    conn = 'on'; remoteLoaded = true; remoteEmpty = !(res.config && res.config.distribuidoras);
    if (res.config && res.config.distribuidoras && (res.config.version || 1) >= 2 && !editing){
      const localT = Date.parse(config.updatedAt || 0) || 0, remT = Date.parse(res.config.updatedAt || 0) || 0;
      if (remT >= localT){ config = res.config; lsSet(LS.config, config); }
    }
    if (res.ultimas){ for (const k in res.ultimas){ if (!ultimas[k] || res.ultimas[k] > ultimas[k]) ultimas[k] = res.ultimas[k]; } lsSet(LS.ultimas, ultimas); }
    paintConn(); route(true);
    flushQueue();
  }catch(e){ conn = 'off'; paintConn(); }
}
async function flushQueue(){
  if (!API_URL || !queue.length) return;
  const pend = [...queue];
  for (const item of pend){
    try{
      const res = await apiPost(item);
      if (!res || !res.ok) throw 0;
      queue = queue.filter(q => q.id !== item.id); lsSet(LS.queue, queue);
      conn = 'on';
    }catch(e){ conn = 'off'; break; }
  }
  paintConn();
}
window.addEventListener('online', () => { loadRemote(); });

let toastT;
function toast(msg, bad){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast' + (bad ? ' bad' : ''), 3200);
}

/* ---------- Rutas: #/  #/d/<id>  #/d/<id>/l/<id> ---------- */
let lastRoute = '';
function route(soft){
  const h = location.hash.replace(/^#\/?/, '');
  const p = h.split('/').filter(Boolean);
  const app = $('#app');
  const key = h + (editing ? '|e' : '');
  const animate = !soft && key !== lastRoute;
  lastRoute = key;
  let html;
  if (p[0] === 'd' && p[1]){
    const d = findD(p[1]);
    if (!d) html = viewNotFound();
    else if (p[2] === 'l' && p[3]){
      const l = findL(d, p[3]);
      html = !l ? viewNotFound(d) : (editing ? viewEditor(d, l) : (p[4] === 'ok' && lastDone ? viewDone(d, l) : viewChecklist(d, l)));
    } else html = viewDistrib(d);
  } else html = viewHome();
  document.body.classList.add('light');
  app.innerHTML = `<div class="${animate ? 'view' : ''}">${html}</div>`;
  if (!soft) window.scrollTo(0, 0);
  if (p[2] === 'l' && !editing) paintProgress();
}
window.addEventListener('hashchange', () => {
  if (!location.hash.endsWith('/ok')) lastDone = null;
  route();
});

function crumbs(items){
  const backHref = items.length > 1 ? items[items.length - 2].href : '#/';
  return `<nav class="crumbs" aria-label="Ruta">
    <a class="back" href="${backHref}">${ICON.back}Regresar</a>
    <span class="trail">${items.map((it, i) => i < items.length - 1
      ? `<a href="${it.href}">${esc(it.t)}</a><span class="sep">/</span>`
      : `<b>${esc(it.t)}</b>`).join('')}</span></nav>`;
}
/* Frecuencia de cada línea: define cuándo vuelve a quedar pendiente */
const FRECS = {
  diaria:  {nombre:'Diaria',  periodo:'hoy',         inicio:() => { const x = new Date(); x.setHours(0,0,0,0); return x; }},
  semanal: {nombre:'Semanal', periodo:'esta semana', inicio:() => inicioSemana()},
  mensual: {nombre:'Mensual', periodo:'este mes',    inicio:() => { const x = new Date(); x.setHours(0,0,0,0); x.setDate(1); return x; }}
};
const frecDe = l => FRECS[l && l.frecuencia] ? l.frecuencia : 'semanal';
const fechaUlt = u => new Date(u.length === 10 ? u + 'T12:00:00' : u);
const hechaEnPeriodo = (d, l) => { const u = ultimas[lineKey(d, l)]; return !!u && fechaUlt(u) >= FRECS[frecDe(l)].inicio(); };
function semana(d, l){
  const u = ultimas[lineKey(d, l)], F = FRECS[frecDe(l)];
  if (!u) return `<span class="st none">${ICON.dash}Sin registros</span>`;
  return fechaUlt(u) >= F.inicio()
    ? `<span class="st done">${ICON.check}Hecho ${F.periodo}</span>`
    : `<span class="st pend">${ICON.clock}Pendiente ${F.periodo}, último ${esc(fechaLarga(u))}</span>`;
}

function saveDrafts(dr){ if (dr) dr.savedAt = new Date().toISOString(); lsSet(LS.draft, drafts); }

  grupos(l).forEach(g => l.actividades.filter(a => a.cat === g.id).forEach(a => out.push(a)));

}

const fechaHora = iso => { const f = new Date(iso); return isNaN(f) ? '' : f.toLocaleString('es-GT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); };

function viewChecklist(d, l){
  const dr = getDraft(d, l);
  const oper = dr.operador ?? lsGet(LS.oper, '');
  const acts = orderedActs(l);
  const trail = crumbs([{t:'Inicio', href:'#/'}, {t:d.nombre, href:'#/d/' + d.id}, {t:l.nombre, href:'#'}]);
  if (!acts.length){
    return `${trail}
      <div class="lhead"><div><h2>${esc(l.nombre)}</h2>${l.equipo ? `<p class="eq">${esc(l.equipo)}</p>` : ''}</div></div>
      <div class="emptybox"><h3>Esta línea no tiene actividades</h3><p>Entre en Modo edición (candado arriba) para agregar las actividades del checklist.</p></div>`;
  }
  const answered = acts.filter(a => dr.resp[a.id] && dr.resp[a.id].v).length;
  const cats = grupos(l).filter(c => acts.some(a => a.cat === c.id));
  let n = 0;
  const groups = cats.map((c, gi) => {
    const list = acts.filter(a => a.cat === c.id);
    return `<section class="ot-grp" id="g-${c.id}">
      <div class="ot-grp-h"><span class="k num">${gi + 1}</span><h3>${esc(c.nombre)}</h3>
        <span class="cc num" data-cc="${c.id}"></span><span class="ncb" data-ncb="${c.id}" hidden></span></div>
      ${c.nota ? `<p class="ot-warn">${ICON.warn}${esc(c.nota)}</p>` : ''}
      ${list.map(a => rowHTML(a, ++n, dr.resp[a.id], l)).join('')}
    </section>`;
  }).join('');
  const t = dr.turno || '';
  return `${trail}
  <div class="ot">

function currentDL(){
  const p = location.hash.replace(/^#\/?/, '').split('/');
  const d = findD(p[1]); return {d, l: findL(d, p[3])};
}
function paintProgress(){
  const {d, l} = currentDL(); if (!d || !l || !$('#pDone')) return;
  const dr = getDraft(d, l), acts = orderedActs(l);
  let ok = 0, nc = 0;
  acts.forEach(a => { const v = dr.resp[a.id] && dr.resp[a.id].v; if (v === 'ok') ok++; if (v === 'nc') nc++; });
  $('#pDone').textContent = `${ok + nc}/${acts.length}`;
  $('#pOk').textContent = `${ok} cumple`;
  $('#pNc').textContent = `${nc} no cumple`;
  $('#pFill').style.transform = `scaleX(${acts.length ? (ok + nc) / acts.length : 0})`;
  grupos(l).forEach(c => {
    const list = acts.filter(a => a.cat === c.id); if (!list.length) return;
    const r = list.filter(a => dr.resp[a.id] && dr.resp[a.id].v).length;
    const bad = list.filter(a => dr.resp[a.id] && dr.resp[a.id].v === 'nc').length;
    const cc = document.querySelector(`[data-cc="${c.id}"]`); if (cc) cc.textContent = `${r}/${list.length}`;
    const nb = document.querySelector(`[data-ncb="${c.id}"]`); if (nb){ nb.hidden = !bad; nb.textContent = `${bad} no cumple`; }
    const st = document.querySelector(`.ot-step[data-c="${c.id}"]`);
    if (st){ st.classList.toggle('is-ok', r === list.length && !bad); st.classList.toggle('is-bad', bad > 0); }
  });
}
function markRow(id){ const el = document.getElementById('a-' + id); if (el) el.classList.add('need'); return el; }

async function submitChecklist(){
  const {d, l} = currentDL(); const dr = getDraft(d, l); const acts = orderedActs(l);
  document.querySelectorAll('.ot .need').forEach(e => e.classList.remove('need'));
  const oper = ($('#oper').value || '').trim();
  if (!oper){ $('#fOper').classList.add('need'); $('#oper').focus(); toast('Escriba el nombre del técnico.', true); return; }
  if (!dr.turno){ $('#fTurno').classList.add('need'); $('#fTurno').scrollIntoView({behavior:'smooth', block:'center'}); toast('Seleccione el turno.', true); return; }
  const faltan = acts.filter(a => !(dr.resp[a.id] && dr.resp[a.id].v));
  const incompletos = acts.filter(a => { const r = dr.resp[a.id]; return r && r.v === 'nc' && (!r.motivo || !(r.desc || '').trim() || !(r.equipo || '').trim() || !r.tipo); });
  if (faltan.length || incompletos.length){
    [...faltan, ...incompletos].forEach(a => markRow(a.id));
    const first = [...faltan, ...incompletos].sort((x, y) => acts.indexOf(x) - acts.indexOf(y))[0];
    document.getElementById('a-' + first.id).scrollIntoView({behavior:'smooth', block:'center'});
    toast(faltan.length ? `Faltan ${plural(faltan.length,'actividad','actividades')} por responder.`
      : 'Complete los datos de lo que no cumple: motivo, descripción, equipo y tipo de falla.', true);
    return;
  }
  const hall = acts.filter(a => dr.resp[a.id].v === 'nc').map(a => {
    const c = grupoDe(l, a); const r = dr.resp[a.id];
    return {actividadId:a.id, categoria:c.nombre, actividad:a.texto, motivo:r.motivo, descripcion:r.desc.trim(),
      equipo:r.equipo.trim(), subequipo:(r.subequipo || '').trim(), tipoFalla:r.tipo, criticidad:r.crit || 'Media',
      evidencia:(r.evid || '').trim(), observacion:(r.obs || '').trim()};
  });
  const obs = acts.filter(a => dr.resp[a.id].v === 'ok' && (dr.resp[a.id].obs || '').trim())
    .map(a => ({actividad:a.texto, observacion:dr.resp[a.id].obs.trim()}));
  const payload = {
    action:'checklist', id:uid('chk-'), enviado:new Date().toISOString(),
    fecha:($('#fecha').value || hoyISO()), turno:dr.turno, supervisor:(dr.supervisor || '').trim(),
    frecuencia:FRECS[frecDe(l)].nombre, estadoEquipo:'En funcionamiento y parada',
    distribuidora:{id:d.id, nombre:d.nombre}, linea:{id:l.id, nombre:l.nombre, equipo:l.equipo || ''},
    operador:oper, total:acts.length, cumple:acts.length - hall.length, noCumple:hall.length,
    hallazgos:hall, observaciones:obs
  };
  const btn = document.querySelector('[data-act="submit"]'); btn.disabled = true; btn.textContent = 'Enviando…';
  let sent = false;
  if (API_URL){
    try{ const res = await apiPost(payload); sent = !!(res && res.ok); conn = sent ? 'on' : 'off'; }
    catch(e){ conn = 'off'; }
  }
  if (!sent){ queue.push(payload); lsSet(LS.queue, queue); }
  paintConn();
  const k = lineKey(d, l);
  if (!ultimas[k] || payload.fecha > ultimas[k]) ultimas[k] = payload.fecha; lsSet(LS.ultimas, ultimas);
  delete drafts[k]; saveDrafts();
  lastDone = {sent, payload};
  clearTimeout(toastT); $('#toast').className = 'toast';
  location.hash = `#/d/${d.id}/l/${l.id}/ok`;
}

  <div class="done">
    <div class="ico ${sent ? 'ok' : 'q'}">${sent ? ICON.check : ICON.clock}</div>

  b.setAttribute('aria-pressed', editing);
  b.innerHTML = (editing ? ICON.unlock : ICON.lock) + `<span class="lbl">${editing ? 'Editando' : 'Editar'}</span>`;
  b.title = editing ? 'Modo edición activo' : 'Agregar o borrar líneas (pide contraseña)';

function paintDirty(){
  $('#editMsg').textContent = dirty ? 'Tiene cambios sin guardar. Los operadores no los verán hasta que pulse Guardar cambios.'
    : 'Puede agregar, cambiar o borrar distribuidoras, líneas y actividades.';

}
function markDirty(){ dirty = true; paintDirty(); }
function askPin(){
  openDlg(`<h3>Modo edición</h3><p>Escriba la contraseña para agregar, cambiar o borrar líneas y actividades.</p>
    <div class="field"><label for="pinIn">Contraseña</label><input id="pinIn" class="pinbox" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></div>

    <div class="dlg-act"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok" id="pinOk">Entrar</button></div>`,
    () => {
      const v = $('#pinIn').value.trim();
      if (hashPin(v) !== (config.pinHash || DEFAULT_PIN_HASH)){ $('#pinErr').textContent = 'Contraseña incorrecta.'; $('#pinIn').select(); return false; }
      if (API_URL && !remoteLoaded){ $('#pinErr').textContent = 'Sin conexión con la hoja. Conéctese a internet y espere a que arriba diga Conectado.'; loadRemote(); return false; }

function exitEdit(force){
  if (dirty && !force){
    openDlg(`<h3>¿Salir sin guardar?</h3><p>Los cambios que hizo se van a perder.</p>
      <div class="dlg-act"><button class="btn ghost" value="cancel">Seguir editando</button><button class="btn primary" value="ok">Salir sin guardar</button></div>`,
      () => exitEdit(true));
    return;
  }
  editing = false; draft = null; pin = ''; dirty = false;
  if (location.hash.endsWith('/ok')) location.hash = '#/';

}
async function saveConfig(){
  const clean = JSON.parse(JSON.stringify(draft));
  for (const d of clean.distribuidoras) for (const l of d.lineas) for (const g of grupos(l)){
    g.nombre = (g.nombre || '').trim(); g.nota = (g.nota || '').trim();
    if (!g.nombre){ toast(`Hay un grupo sin nombre en ${d.nombre}, ${l.nombre}.`, true); return; }
  }
  clean.distribuidoras.forEach(d => d.lineas.forEach(l => { l.actividades = l.actividades.filter(a => a.texto.trim()).map(a => ({...a, texto:a.texto.trim(), criterio:(a.criterio || '').trim()})); }));
  clean.updatedAt = new Date().toISOString();
  const btn = $('#saveCfg'); btn.disabled = true;
  if (API_URL){
    try{
      const res = await apiPost({action:'saveConfig', pin, config:clean});
      if (!res || !res.ok){
        if (res && res.error === 'pin'){ toast('La hoja rechazó la contraseña. Revise EDIT_PIN en Apps Script.', true); paintDirty(); return; }
        throw 0;
      }
      conn = 'on';
    }catch(e){ conn = 'off'; paintConn(); toast('No se pudo guardar en la hoja. Revise la conexión e intente otra vez.', true); paintDirty(); return; }
  }
  config = clean; draft = JSON.parse(JSON.stringify(clean)); lsSet(LS.config, config); remoteEmpty = false;
  dirty = false; paintConn(); paintDirty(); route(true);
  toast(API_URL ? 'Cambios guardados para todos los operadores' : 'Cambios guardados en este equipo (falta conectar Apps Script)');
}

/* ---------- Importar y descargar actividades en Excel ---------- */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxPromise = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = XLSX_URL;
    sc.onload = () => window.XLSX ? ok(window.XLSX) : fail(new Error('xlsx'));
    sc.onerror = () => { xlsxPromise = null; fail(new Error('xlsx')); };
    document.head.appendChild(sc);
  });
  return xlsxPromise;
}
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const COLS = {
  grupo:    ['grupo','categoria','seccion','sistema','area'],
  actividad:['actividad','actividades','descripcion','tarea','descripcion de la actividad','que revisar'],
  criterio: ['criterio','explicacion','como verificar','metodo','estandar','detalle'],
  falla:    ['tipo de falla','falla','tipo'],
  aviso:    ['aviso','aviso del grupo','nota','precaucion']
};
function mapHeader(row){
  const idx = {};
  row.forEach((h, i) => { const n = norm(h); for (const k in COLS) if (idx[k] === undefined && COLS[k].includes(n)) idx[k] = i; });
  return idx;
}
function fallaDe(v){
  const n = norm(v);
  if (n.startsWith('ele')) return 'Eléctrico';
  if (n.startsWith('hid')) return 'Hidráulico';
  if (n.startsWith('mec')) return 'Mecánico';
  return '';
}
/* Convierte las filas del archivo en grupos y actividades */
function parseActividades(rows, l){
  let hi = -1, idx = {};
  for (let i = 0; i < Math.min(rows.length, 15); i++){ const m = mapHeader(rows[i] || []); if (m.actividad !== undefined){ hi = i; idx = m; break; } }
  if (hi === -1) return {error:'No se encontró una columna llamada "Actividad". Revise que la primera fila tenga los títulos: Grupo, Actividad, Criterio.'};
  const existentes = grupos(l);
  const gs = [], acts = []; let vacias = 0;
  for (const r of rows.slice(hi + 1)){
    const texto = String(r[idx.actividad] ?? '').trim();
    if (!texto){ if ((r || []).some(c => String(c ?? '').trim())) vacias++; continue; }
    const gNombre = idx.grupo !== undefined ? String(r[idx.grupo] ?? '').trim() : '';
    const nombre = gNombre || (gs.length ? gs[gs.length - 1].nombre : 'Actividades');
    let g = gs.find(x => norm(x.nombre) === norm(nombre));
    if (!g){
      const ex = existentes.find(x => norm(x.nombre) === norm(nombre));
      g = {id:ex ? ex.id : uid('g'), nombre, falla:ex ? ex.falla : 'Mecánico', nota:ex ? ex.nota || '' : '', _fallaSet:false, _notaSet:false};
      gs.push(g);
    }
    const f = idx.falla !== undefined ? fallaDe(r[idx.falla]) : '';
    if (f && !g._fallaSet){ g.falla = f; g._fallaSet = true; }
    const av = idx.aviso !== undefined ? String(r[idx.aviso] ?? '').trim() : '';
    if (av && !g._notaSet){ g.nota = av; g._notaSet = true; }
    acts.push({id:uid('a'), cat:g.id, texto, criterio:idx.criterio !== undefined ? String(r[idx.criterio] ?? '').trim() : ''});
  }
  gs.forEach(g => { delete g._fallaSet; delete g._notaSet; });
  if (!acts.length) return {error:'El archivo no tiene actividades debajo de los títulos.'};
  return {grupos:gs, actividades:acts, vacias};
}
function parseCSV(txt){
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (q){ if (c === '"' && txt[i + 1] === '"'){ cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function leerArchivo(file){
  const esCSV = /\.csv$/i.test(file.name);
  if (esCSV){ return parseCSV((await file.text()).replace(/^﻿/, '')); }
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), {type:'array'});
  const name = wb.SheetNames.find(n => norm(n).includes('actividad')) || wb.SheetNames[0];
  return X.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', blankrows:false});
}
function pedirArchivo(){
  let inp = $('#impFile');
  if (!inp){
    inp = document.createElement('input'); inp.type = 'file'; inp.id = 'impFile'; inp.hidden = true;
    inp.accept = '.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv';
    inp.addEventListener('change', () => { const f = inp.files[0]; inp.value = ''; if (f) importarArchivo(f); });
    document.body.appendChild(inp);
  }
  inp.click();
}
async function importarArchivo(file){
  const {d, l} = currentDL(); if (!d || !l) return;
  let res;
  try { res = parseActividades(await leerArchivo(file), l); }
  catch(e){ toast(/xlsx/.test(e.message) ? 'No se pudo abrir el lector de Excel. Revise el internet o guarde el archivo como CSV.' : 'No se pudo leer el archivo. Revise que sea Excel (.xlsx) o CSV.', true); return; }
  if (res.error){ toast(res.error, true); return; }
  const porGrupo = res.grupos.map(g => ({g, n:res.actividades.filter(a => a.cat === g.id).length}));
  openDlg(`<h3>Importar actividades</h3>
    <p>${esc(file.name)}: <b>${plural(res.actividades.length,'actividad','actividades')}</b> en ${plural(res.grupos.length,'grupo','grupos')}${res.vacias ? `. Se ${res.vacias === 1 ? 'ignoró' : 'ignoraron'} ${plural(res.vacias,'fila','filas')} sin actividad` : ''}.</p>
    <ul class="imp-list">${porGrupo.map(x => `<li><span>${esc(x.g.nombre)}</span><b class="num">${x.n}</b></li>`).join('')}</ul>
    ${res.actividades.length > 40 ? `<p class="err" style="color:var(--warn-text)">Son más de 40 actividades; para el técnico se recomienda un máximo de 40.</p>` : ''}
    <div class="field"><span class="lab-s">¿Qué hacer con las ${plural(l.actividades.length,'actividad actual','actividades actuales')} de ${esc(l.nombre)}?</span>
      <label class="radio"><input type="radio" name="impModo" value="rep" checked> Reemplazarlas por las del archivo</label>
      <label class="radio"><input type="radio" name="impModo" value="add"> Agregar las del archivo al final (sin repetir)</label></div>
    <div class="dlg-act"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" value="ok">Importar</button></div>`,
    () => {
      const modo = (document.querySelector('input[name="impModo"]:checked') || {}).value;
      if (modo === 'add'){
        const gs = grupos(l); let nuevas = 0;
        res.grupos.forEach(g => {
          let tgt = gs.find(x => norm(x.nombre) === norm(g.nombre));
          if (!tgt){ tgt = {...g}; gs.push(tgt); }
          res.actividades.filter(a => a.cat === g.id).forEach(a => {
            if (l.actividades.some(x => x.cat === tgt.id && norm(x.texto) === norm(a.texto))) return;
            l.actividades.push({...a, cat:tgt.id}); nuevas++;
          });
        });
        toast(`${plural(nuevas,'actividad agregada','actividades agregadas')}. Revise y pulse Guardar cambios.`);
      } else {
        l.grupos = res.grupos; l.actividades = res.actividades;
        toast('Actividades reemplazadas. Revise y pulse Guardar cambios.');
      }
      markDirty(); route(true);
    });
}
async function descargarExcel(){
  const {d, l} = currentDL(); if (!d || !l) return;
  const filas = [['Grupo','Actividad','Criterio','Tipo de falla','Aviso']];
  const gs = grupos(l);
  gs.forEach(g => l.actividades.filter(a => a.cat === g.id).forEach((a, i) =>
    filas.push([g.nombre, a.texto, a.criterio || '', g.falla || '', i === 0 ? g.nota || '' : ''])));
  if (filas.length === 1){
    filas.push(['Inspección general','Tablero eléctrico cerrado, sin cables sueltos ni pelados','Revisar solo por fuera.','Eléctrico','']);
    filas.push(['Lubricación de rodos','Engrasar los rodos','Poner la grasa indicada, sin exceso.','Mecánico','Hacerlo con la máquina apagada.']);
  }
  const nombre = `Actividades_${slug(d.nombre)}_${slug(l.nombre)}`;
  try{
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(filas);
    ws['!cols'] = [{wch:28},{wch:60},{wch:45},{wch:14},{wch:36}];
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Actividades');
    X.writeFile(wb, nombre + '.xlsx');
  }catch(e){
    const csv = '﻿' + filas.map(r => r.map(c => /[",;\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = nombre + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
}

function lineDialog(d, l){
  const all = [];
  cfg().distribuidoras.forEach(dd => dd.lineas.forEach(ll => { if (ll.actividades.length) all.push({k:dd.id + '/' + ll.id, t:`${dd.nombre}, ${ll.nombre} (${ll.actividades.length})`}); }));
  openDlg(`<h3>${l ? 'Editar línea' : 'Agregar línea'}</h3><p>${esc(d.nombre)}</p>
    <div class="field"><label for="lnN">Nombre de la línea</label><input id="lnN" maxlength="60" placeholder="Ej.: Dobladora 2" value="${esc(l ? l.nombre : '')}"></div>
    <div class="field"><label for="lnE">Equipo</label><input id="lnE" maxlength="90" placeholder="Ej.: Dobladora hidráulica (prensa plegadora)" value="${esc(l ? l.equipo || '' : '')}"></div>
    <div class="field"><label for="lnF">¿Cada cuánto se hace?</label><select id="lnF">${Object.entries(FRECS).map(([k, F]) => `<option value="${k}"${(l ? frecDe(l) : 'semanal') === k ? ' selected' : ''}>${F.nombre}: aparece pendiente cada ${F.periodo === 'hoy' ? 'día' : F.periodo.replace('esta ', '').replace('este ', '')}</option>`).join('')}</select></div>
    ${l ? '' : `<div class="field"><label for="lnC">Actividades</label><select id="lnC"><option value="">Empezar vacía</option>${all.map(o => `<option value="${esc(o.k)}">Copiar de ${esc(o.t)}</option>`).join('')}</select></div>`}
    <p class="err" id="lnErr"></p>
    <div class="dlg-act"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" value="ok">${l ? 'Aplicar' : 'Agregar'}</button></div>`,
    () => {
      const nombre = $('#lnN').value.trim(), equipo = $('#lnE').value.trim(), frecuencia = $('#lnF').value || 'semanal';
      if (!nombre){ $('#lnErr').textContent = 'Escriba el nombre de la línea.'; return false; }
      if (d.lineas.some(x => x !== l && x.nombre.toLowerCase() === nombre.toLowerCase())){ $('#lnErr').textContent = 'Ya existe una línea con ese nombre en esta distribuidora.'; return false; }
      if (l){ l.nombre = nombre; l.equipo = equipo; l.frecuencia = frecuencia; }
      else {
        let id = slug(nombre), i = 2; while (d.lineas.some(x => x.id === id)) id = slug(nombre) + '-' + i++;
        let acts = [];
        const src = $('#lnC').value;
        let gr = DEFAULT_GRUPOS();
        if (src){ const [sd, sl] = src.split('/'); const so = findL(findD(sd), sl); acts = so.actividades.map(a => ({...a, id:uid('a')})); gr = grupos(so).map(g => ({...g})); }
        d.lineas.push({id, nombre, equipo, frecuencia, grupos:gr, actividades:acts});
      }
      markDirty(); route(true);
      toast(l ? 'Línea actualizada' : 'Línea agregada. Pulse Guardar cambios para publicarla.');
    }, '#lnN');
}
function delLineDialog(d, l){
  openDlg(`<h3>Borrar línea</h3><p>Se borrará <b>${esc(l.nombre)}</b> de ${esc(d.nombre)} con sus ${plural(l.actividades.length,'actividad','actividades')}. Los registros ya enviados a la hoja no se borran.</p>
    <div class="dlg-act"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" value="ok">${ICON.trash}Borrar línea</button></div>`,
    () => { d.lineas = d.lineas.filter(x => x !== l); markDirty();
      if (location.hash.includes('/l/')) location.hash = '#/d/' + d.id; else route(true);
      toast('Línea borrada. Pulse Guardar cambios para confirmar.'); });
}
async function copyLink(d, l){
  const url = location.href.split('#')[0] + `#/d/${d.id}/l/${l.id}`;
  try{ await navigator.clipboard.writeText(url); toast('Enlace copiado. Úselo para generar el QR de esta línea.'); }
  catch(e){ openDlg(`<h3>Enlace para el QR</h3><p>Copie este enlace y genere el QR de la línea.</p><div class="field"><input id="lnk" value="${esc(url)}" readonly></div>
    <div class="dlg-act"><button class="btn primary" value="ok">Listo</button></div>`, () => {}, '#lnk'); }
}

let dlgOk = null;
function openDlg(html, onOk, focusSel){
  const dlg = $('#dlg'); $('#dlgForm').innerHTML = html; dlgOk = onOk;
  if (!dlg.open) dlg.showModal();
  if (focusSel) setTimeout(() => { const el = $(focusSel); if (el){ el.focus(); el.select && el.select(); } }, 30);
}
$('#dlgForm').addEventListener('submit', e => {
  const v = e.submitter ? e.submitter.value : 'ok';
  if (v === 'cancel') return;
  if (dlgOk && dlgOk() === false) e.preventDefault();
});

$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  const p = location.hash.replace(/^#\/?/, '').split('/');
  const d = findD(p[1]);
  if (act === 'addDist') return distDialog();
  if (act === 'editDist') return distDialog(findD(t.dataset.d));
  if (act === 'delDist') return delDistDialog(findD(t.dataset.d));
  if (act === 'addLine') return lineDialog(d);
  if (act === 'editLine') return lineDialog(d, findL(d, t.dataset.l));
  if (act === 'delLine') return delLineDialog(d, findL(d, t.dataset.l));
  if (act === 'copyLink'){ e.preventDefault(); return copyLink(d, findL(d, t.dataset.l)); }

  const l = findL(d, p[3]);
  if (editing && l){
    const gs = grupos(l);
    if (act === 'impXls') return pedirArchivo();
    if (act === 'expXls') return descargarExcel();
    if (act === 'addGrupo'){
      const g = {id:uid('g'), nombre:'Nuevo grupo', falla:'Mecánico', nota:''}; gs.push(g);
      markDirty(); route(true);
      const el = document.querySelector(`.ed-cat[data-g="${g.id}"] .ed-gname`); if (el){ el.scrollIntoView({block:'center'}); el.focus(); el.select(); }
      return;
    }
    const sec = t.closest('.ed-cat'); const g = sec && gs.find(x => x.id === sec.dataset.g);
    if (g && (act === 'gUp' || act === 'gDown')){
      const i = gs.indexOf(g), j = act === 'gUp' ? i - 1 : i + 1; if (j < 0 || j >= gs.length) return;
      [gs[i], gs[j]] = [gs[j], gs[i]]; markDirty(); route(true);
      const b = document.querySelector(`.ed-cat[data-g="${g.id}"] [data-act="${act}"]`); if (b && !b.disabled) b.focus();
      return;
    }
    if (g && act === 'gDel'){
      if (gs.length === 1) return;
      const na = l.actividades.filter(a => a.cat === g.id).length;
      const borrar = () => { l.grupos = gs.filter(x => x !== g); l.actividades = l.actividades.filter(a => a.cat !== g.id); markDirty(); route(true); toast('Grupo borrado'); };
      if (!na) return borrar();
      openDlg(`<h3>Borrar grupo</h3><p>Se borrará el grupo <b>${esc(g.nombre)}</b> con sus ${plural(na,'actividad','actividades')}. Si quiere conservarlas, primero cámbielas de grupo.</p>
        <div class="dlg-act"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" value="ok">${ICON.trash}Borrar grupo</button></div>`, borrar);
      return;
    }
    const row = t.closest('.ed-row'); const a = row && l.actividades.find(x => x.id === row.dataset.id);
    if (act === 'addAct'){
      const na = {id:uid('a'), cat:t.dataset.cat, texto:'', criterio:''};
      const idx = l.actividades.map(x => x.cat).lastIndexOf(t.dataset.cat);
      l.actividades.splice(idx === -1 ? l.actividades.length : idx + 1, 0, na);
      markDirty(); route(true);
      const el = document.querySelector(`.ed-row[data-id="${na.id}"] textarea`); if (el){ el.focus(); el.scrollIntoView({block:'center'}); }
      return;
    }
    if (!a) return;
    if (act === 'delAct'){ l.actividades = l.actividades.filter(x => x !== a); markDirty(); route(true); toast('Actividad borrada'); return; }
    if (act === 'mvUp' || act === 'mvDown'){
      const same = l.actividades.filter(x => x.cat === a.cat); const i = same.indexOf(a); const j = act === 'mvUp' ? i - 1 : i + 1;
      if (j < 0 || j >= same.length) return;
      const ai = l.actividades.indexOf(a), bi = l.actividades.indexOf(same[j]);
      [l.actividades[ai], l.actividades[bi]] = [l.actividades[bi], l.actividades[ai]];
      markDirty(); route(true);
      const b = document.querySelector(`.ed-row[data-id="${a.id}"] [data-act="${act}"]`); if (b && !b.disabled) b.focus();
      return;
    }
    return;
  }

  if (!l) return;
  const dr = getDraft(d, l);
  if (act === 'goCat'){ const el = document.getElementById('g-' + t.dataset.c); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if (act === 'reset'){
    openDlg(`<h3>Empezar de nuevo</h3><p>Se borrarán las respuestas guardadas de esta línea. Esta acción no se puede deshacer.</p>
      <div class="dlg-act"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" value="ok">Empezar de nuevo</button></div>`,
      () => { delete drafts[lineKey(d, l)]; saveDrafts(); route(true); paintProgress(); });
    return;
  }
  if (act === 'saveProg'){ saveDrafts(dr); toast('Avance guardado. Puede cerrar y seguir después en este teléfono.'); return; }
  if (act === 'submit') return submitChecklist();
  if (act === 'turno'){
    dr.turno = t.dataset.v; saveDrafts(dr);
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('#fTurno').classList.remove('need'); return;
  }
  const row = t.closest('.ot-row'); if (!row) return;
  const aid = row.dataset.id; const a = l.actividades.find(x => x.id === aid);
  if (act === 'ans'){
    const v = t.dataset.v; const prev = dr.resp[aid] || {};
    dr.resp[aid] = v === 'nc' ? {...ncDefaults(a, l), ...prev, v} : {...prev, v};
    saveDrafts(dr);
    const wrap = document.createElement('div'); wrap.innerHTML = rowHTML(a, Number(row.dataset.n), dr.resp[aid], l);
    const fresh = wrap.firstElementChild; row.replaceWith(fresh);
    paintProgress();
    if (v === 'nc' && prev.v !== 'nc'){ const ch = fresh.querySelector('.ot-chip'); if (ch) setTimeout(() => ch.focus({preventScroll:true}), 60); }
    return;
  }
  if (act === 'motivo' || act === 'nc-tipo'){
    dr.resp[aid][act === 'motivo' ? 'motivo' : 'tipo'] = t.dataset.v; saveDrafts(dr);
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t));
  }
});

$('#app').addEventListener('change', e => {

  if (t.dataset.act !== 'edCat') return;
  const p = location.hash.replace(/^#\/?/, '').split('/');
  const l = findL(findD(p[1]), p[3]); const row = t.closest('.ed-row'); const a = l.actividades.find(x => x.id === row.dataset.id);
  a.cat = t.value; l.actividades = l.actividades.filter(x => x !== a);
  const idx = l.actividades.map(x => x.cat).lastIndexOf(a.cat); l.actividades.splice(idx === -1 ? l.actividades.length : idx + 1, 0, a);
  markDirty(); route(true); toast('Actividad movida a ' + grupoDe(l, a).nombre);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && editing){ e.preventDefault(); if (dirty) saveConfig(); }
});
window.addEventListener('beforeunload', e => { if (editing && dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- Inicio ---------- */
paintLock(); paintConn(); route(); loadRemote();
</script>
